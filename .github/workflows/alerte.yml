name: Alerte solaire

on:
  schedule:
    # 5:43 UTC = 8 h en heure d'été, 7 h en heure d'hiver (France). GitHub peut retarder de quelques minutes. En réalité l'alerte tombe vers 14h00...
    - cron: "43 5 * * *"
  workflow_dispatch:   # permet un lancement manuel pour tester

permissions:
  contents: read

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Envoyer le résumé
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT_NAME: ${{ github.event_name }}
        run: node alerte.js
