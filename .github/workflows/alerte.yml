name: Alerte solaire

on:
  # Cron désactivé le 2026-11-18 : GitHub ne le déclenchait ni tous les jours
  # ni à l'heure voulue (souvent vers 14 h au lieu de 8 h). Les données sont
  # consultées directement dans l'onglet navigateur (index.html).
  # Pour réactiver, remettre :
  #   schedule:
  #     - cron: "43 5 * * *"
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions de GitHub

permissions:
  contents: read

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Envoyer le résumé
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT_NAME: ${{ github.event_name }}
        run: node alerte.js
